<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wordsy">
<meta name="description" content="Wordsy: карточки для английских слов с интервальным повторением (FSRS). Қазақша · Русский · English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Wordsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Wordsy identity: "steppe sunrise". Ink navy, sky blue and sun gold; flat soft surfaces, pill buttons, a floating dock. */
:root{
  --bg:#f3f5f9; --card:#ffffff; --surface:#ebeff5; --surface-2:#dfe5ee; --line:#dce2ec; --fg:#16203a; --muted:#646e88;
  --primary:#16203a; --on-primary:#ffffff; --logo-bg:#16203a; --hero:#16203a; --hero-2:#22346a;
  --sky:#2f7bea; --sky-soft:#e3eefd; --sky-ink:#1c5dc0;
  --sun:#f2b400; --sun-soft:#fdf3d3; --sun-ink:#8a6200;
  --again:#e0484e; --again-soft:#fce6e7; --again-ink:#b4262c;
  --hard:#e08a12; --hard-soft:#fcefd9; --hard-ink:#955800;
  --good:#169c74; --good-soft:#dcf3ea; --good-ink:#0b7454;
  --easy:#2f7bea; --easy-soft:#e3eefd; --easy-ink:#1c5dc0;
  --violet:#7457e0; --violet-soft:#ece6fc; --violet-ink:#5a3dc4;
  --flame:#ea6d1c;
  --shadow-sm:0 1px 2px rgba(22,32,58,.06),0 3px 10px rgba(22,32,58,.05);
  --shadow:0 2px 6px rgba(22,32,58,.06),0 14px 34px rgba(22,32,58,.10);
  --edge:transparent;
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --font:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1322; --card:#151d31; --surface:#1b243c; --surface-2:#253050; --line:#28324f; --fg:#eef1f8; --muted:#98a1bb;
    --primary:#f2b400; --on-primary:#16203a; --logo-bg:#253050; --hero:#18244a; --hero-2:#273c7a;
    --sky:#5c9cf5; --sky-soft:#1b2b4a; --sky-ink:#8bb9fa;
    --sun:#f5c02e; --sun-soft:#3a3118; --sun-ink:#f5c02e;
    --again:#f06a6f; --again-soft:#3c2129; --again-ink:#ff9a9e;
    --hard:#f2a23a; --hard-soft:#3a2e1a; --hard-ink:#ffc274;
    --good:#35c292; --good-soft:#163a31; --good-ink:#6fe0b8;
    --easy:#5c9cf5; --easy-soft:#1b2b4a; --easy-ink:#8bb9fa;
    --violet:#9c84f2; --violet-soft:#2a2448; --violet-ink:#c2b2ff;
    --flame:#ff9440; --edge:#28324f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1322; --card:#151d31; --surface:#1b243c; --surface-2:#253050; --line:#28324f; --fg:#eef1f8; --muted:#98a1bb;
  --primary:#f2b400; --on-primary:#16203a; --logo-bg:#253050; --hero:#18244a; --hero-2:#273c7a;
  --sky:#5c9cf5; --sky-soft:#1b2b4a; --sky-ink:#8bb9fa;
  --sun:#f5c02e; --sun-soft:#3a3118; --sun-ink:#f5c02e;
  --again:#f06a6f; --again-soft:#3c2129; --again-ink:#ff9a9e;
  --hard:#f2a23a; --hard-soft:#3a2e1a; --hard-ink:#ffc274;
  --good:#35c292; --good-soft:#163a31; --good-ink:#6fe0b8;
  --easy:#5c9cf5; --easy-soft:#1b2b4a; --easy-ink:#8bb9fa;
  --violet:#9c84f2; --violet-soft:#2a2448; --violet-ink:#c2b2ff;
  --flame:#ff9440; --edge:#28324f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance;letter-spacing:-.015em;line-height:1.2}
.title{font-size:22px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;padding-block:6px 14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;flex:none;display:block}
.logo-mark.big{width:68px;height:68px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.chip.flame{color:var(--flame)}
.chip.xp{color:var(--violet)}
.sync{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)}
.sync.warn::before{background:var(--hard)}
@media (max-width:380px){.sync{font-size:0;gap:0}}
.lang-pick{display:flex;background:var(--card);box-shadow:var(--shadow-sm);border-radius:999px;padding:3px;gap:2px}
.lang-pick button{border:0;background:none;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.lang-pick button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* Buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;cursor:pointer;
  background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .15s, filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;text-align:center}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.rate:focus-visible,.say:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.deck:focus-visible,.student:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sun{background:var(--sun);color:#16203a}
.btn.blue{background:var(--sky);color:#fff}
.btn.violet{background:var(--violet);color:#fff}
.btn.danger{background:var(--again);color:#fff}
.btn.small{min-height:40px;padding:8px 16px;font-size:14px}
.btn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.icon-btn{appearance:none;border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}

/* Panels */
.panel{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--edge)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;color:#fff;border:0;
  background:radial-gradient(circle at 92% 118%, var(--sun) 0 52px, transparent 53px),linear-gradient(135deg,var(--hero),var(--hero-2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18) 40%,rgba(255,255,255,.18));pointer-events:none}
.hero h1{font-size:20px;color:#fff}
.hero .sub{color:rgba(255,255,255,.72);font-weight:500}
.ring{width:100px;height:100px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .num b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{border-radius:var(--r-md);padding:12px 14px;background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--edge)}
.count b{display:block;font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.count span{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.count span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.count.new{--c:var(--sky)} .count.learn{--c:var(--again)} .count.rev{--c:var(--good)}
.section-title{font-family:var(--font);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 4px 10px}
.deck{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;width:100%;transition:transform .1s, box-shadow .15s}
.deck:hover{box-shadow:var(--shadow)}
.deck:active{transform:scale(.99)}
.deck .badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none;font-size:17px}
.deck .meta{flex:1;min-width:0}
.deck .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .sub{font-size:13px;color:var(--muted);font-weight:500}
.pills{display:flex;gap:4px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pills span{min-width:26px;text-align:center;padding:3px 6px;border-radius:8px}
.pills .n{color:var(--sky-ink);background:var(--sky-soft)} .pills .l{color:var(--again-ink);background:var(--again-soft)} .pills .r{color:var(--good-ink);background:var(--good-soft)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--sun-soft);border-radius:var(--r-md);padding:14px 16px;font-weight:500;font-size:15px}
.tip svg{flex:none;width:22px;height:22px;color:var(--sun-ink);margin-top:1px}

/* Floating dock */
.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none;padding-inline:max(12px,env(safe-area-inset-left,0px))}
.tabs-inner{pointer-events:auto;display:flex;max-width:536px;width:100%;gap:2px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow);border:1px solid var(--edge)}
.tab{appearance:none;background:none;border:0;border-radius:18px;padding:7px 2px 6px;display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.tabs-inner.six .tab{font-size:9.5px;letter-spacing:-.02em;padding-inline:0}
.tabs-inner.six .tab svg{width:22px;height:22px}
input[type=range]{accent-color:var(--sky);width:100%}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:500;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font-weight:500;resize:vertical}
.input:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 4px var(--sky-soft)}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--sky)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow-sm)}
.tr-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.tr-fields{grid-template-columns:1fr}}
.lang-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--surface);color:var(--muted);vertical-align:1px;margin-right:4px}

/* Word list */
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.search input{padding-left:40px}
.wlist{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:1px solid var(--edge);padding:2px 12px}
.word{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .w{flex:1;min-width:0}
.word .w b{font-weight:600}
.word .w div{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.new{background:var(--sky-soft);color:var(--sky-ink)}
.tag.learn{background:var(--again-soft);color:var(--again-ink)}
.tag.young{background:var(--hard-soft);color:var(--hard-ink)}
.tag.mature{background:var(--good-soft);color:var(--good-ink)}

/* Study */
.study{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-top{display:flex;align-items:center;gap:12px;max-width:640px;width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--sun));transition:width .35s ease}
.prog-n{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.study-body{flex:1;overflow:auto;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin:6px 4px 12px;display:flex;align-items:center;gap:8px;color:var(--c)}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.kind.new{--c:var(--sky-ink)} .kind.learn{--c:var(--again-ink)} .kind.rev{--c:var(--good-ink)} .kind.type{--c:var(--violet-ink)}
.flash{border-radius:26px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--edge);padding:28px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.flash::before{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--sun-soft);opacity:.8;pointer-events:none}
.flash > *{position:relative}
.front-word{font-family:var(--display);font-size:clamp(28px,8vw,40px);font-weight:600;line-height:1.15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;word-break:break-word;letter-spacing:-.02em}
.say{appearance:none;border:0;background:var(--sky-soft);color:var(--sky-ink);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .1s}
.say:active{transform:scale(.92)}
.say.small{width:34px;height:34px}
.say svg{width:22px;height:22px}
.say.small svg{width:17px;height:17px}
.example{font-size:18px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.example mark{background:var(--sun-soft);color:inherit;border-radius:6px;padding:0 4px;font-weight:700;box-shadow:inset 0 -2px 0 var(--sun)}
.divider{height:0;border-top:1.5px dashed var(--line);margin:4px 0}
.meaning{font-size:20px;font-weight:600;line-height:1.35}
.ru-btn{align-self:flex-start;appearance:none;border:1.5px dashed var(--line);background:none;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.tr{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r-md);padding:10px 12px}
.tr-row{display:flex;gap:10px;align-items:baseline;font-weight:600;font-size:17px}
.tr-row .lang-tag{flex:none;background:var(--card);margin:0;min-width:38px;text-align:center}
.type-in{font-size:22px;font-weight:600;text-align:center;letter-spacing:.02em}
.verdict{border-radius:var(--r-md);padding:12px 14px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--good-soft);color:var(--good-ink)}
.verdict.almost{background:var(--hard-soft);color:var(--hard-ink)}
.verdict.bad{background:var(--again-soft);color:var(--again-ink)}
.verdict .ans{color:var(--fg);font-size:20px}
.study-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.study-foot .in{max-width:640px;margin:0 auto}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{appearance:none;border:0;border-radius:18px;padding:10px 4px 8px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center;
  background:var(--cs);color:var(--ci);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .1s}
.rate:active{transform:scale(.96)}
.rate small{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.rate .lbl{font-size:15px}
.rate.again{--c:var(--again);--cs:var(--again-soft);--ci:var(--again-ink)}
.rate.hard{--c:var(--hard);--cs:var(--hard-soft);--ci:var(--hard-ink)}
.rate.good{--c:var(--good);--cs:var(--good-soft);--ci:var(--good-ink)}
.rate.easy{--c:var(--easy);--cs:var(--easy-soft);--ci:var(--easy-ink)}
.rate.suggest{box-shadow:inset 0 0 0 2.5px var(--c)}
.keys{text-align:center;font-size:12px;color:var(--muted);font-weight:500;margin-top:8px}
@media (max-width:420px){.keys{display:none}}
.pop{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.flip{animation:flip .45s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(1000px) rotateY(-70deg);opacity:.4}to{transform:none;opacity:1}}

/* Done screen */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:20px}
.done h2{font-size:26px}
.trophy{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd94d,var(--sun) 70%);color:#16203a;display:grid;place-items:center;box-shadow:0 0 0 12px var(--sun-soft)}
.trophy svg{width:56px;height:56px}
.trophy.sky{background:radial-gradient(circle at 35% 30%,#7fb3ff,var(--sky) 70%);color:#fff;box-shadow:0 0 0 12px var(--sky-soft)}
.stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.tile{background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--edge);border-radius:var(--r-md);text-align:center;padding:12px 4px}

  howBody: ["Wordsy использует алгоритм <b>FSRS</b>, как современный Anki. Для каждой карточки он хранит сложность и «прочность» памяти и показывает слово, когда шанс его вспомнить падает до выбранного процента. Каждое «Хорошо» делает память прочнее, и интервал растёт: 4 дня, 2 недели, 2 месяца…",

const LS_KEY = "wordsy.v1";
const DEFAULT_SETTINGS = { newPerDay: 10, maxReviews: 150, retention: 0.9, goal: 20, accent: "en-US", autoplay: true, typingShare: 0.3, maxIvl: 3650 };
const S = { notes: {}, profile: { settings: { ...DEFAULT_SETTINGS }, log: {}, xp: 0, created: Date.now() }, mode: "local", uid: null, loaded: false };
let db = null, profRef = null, notesCol = null;
const writeChain = {};      // per-doc promise chains (one write at a time per doc)
const pendingBody = {};

function lsRead() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
let lsTimer = 0;
function lsWrite() { clearTimeout(lsTimer); lsTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify({ notes: S.notes, profile: S.profile })); } catch {} }, 150); }

function queueWrite(key, ref, body) {
  if (!ref) return;
  pendingBody[key] = body;
  if (writeChain[key]) return;
  const run = async () => {
    while (pendingBody[key] !== undefined) {
      const b = pendingBody[key]; delete pendingBody[key];
      try { if (b === null) await ref.delete(); else await ref.set(b); setSync("ok"); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); if (pendingBody[key] === undefined) pendingBody[key] = b; }
        else if (e && e.code === "quota_exceeded") { toast(t("quota")); setSync("warn"); }
        else setSync("warn");
      }
    }
    delete writeChain[key];
  };
  writeChain[key] = run();
}
function saveNote(n) { S.notes[n.id] = n; lsWrite(); if (notesCol) queueWrite("n:" + n.id, notesCol.doc(n.id), JSON.parse(JSON.stringify(n))); }
function deleteNote(id) { delete S.notes[id]; lsWrite(); if (notesCol) queueWrite("n:" + id, notesCol.doc(id), null); }
let profTimer = 0;
function saveProfile() { lsWrite(); clearTimeout(profTimer); if (profRef) profTimer = setTimeout(() => queueWrite("profile", profRef, JSON.parse(JSON.stringify(S.profile))), 600); }

let syncState = "local";
function setSync(s) { syncState = s; const el = document.getElementById("sync"); if (el) paintSync(el); }
function paintSync(el) {
  el.className = "sync " + (syncState === "ok" ? "ok" : syncState === "warn" ? "warn" : "");
  el.textContent = syncState === "ok" ? t("syncOk") : syncState === "warn" ? t("syncWarn") : syncState === "loading" ? t("syncLoading") : t("syncLocal");
}

/* ---------- Interface language ---------- */
function applyLang() { document.documentElement.lang = LANG; }
function setLang(l) {
  if (!LANGS.includes(l)) return;
  LANG = l; applyLang();
  try { localStorage.setItem(LANG_KEY, l); } catch {}
  if (S.profile.settings.lang !== l) { S.profile.settings.lang = l; saveProfile(); }
  render();
}
// A device without its own choice follows the language saved in the account.
function adoptProfileLang() {
  let own = null; try { own = localStorage.getItem(LANG_KEY); } catch {}
  const pl = S.profile.settings && S.profile.settings.lang;
  if (!own && LANGS.includes(pl) && pl !== LANG) { LANG = pl; applyLang(); }
}

// Notes may be written by Claude in a minimal shape: fill in what is missing.
function normNote(id, n) {
  if (!n || typeof n !== "object" || !n.front) return null;
  const now = Date.now();
  const out = { id, pending: !n.back || !!n.pending, front: String(n.front), back: String(n.back || "—"), example: String(n.example || ""), ru: String(n.ru || ""), kk: String(n.kk || ""), deck: String(n.deck || t("myWords")), cards: n.cards && n.cards.f ? n.cards : null, created: n.created || now, updated: n.updated || 0 };
  if (!out.cards) { out.cards = { f: newSched() }; if (n.reverse !== false) out.cards.r = newSched(); }
  return out;
}
let unsubNotes = null;
async function initStore() {
  const local = lsRead();
  if (local) { S.notes = {}; for (const [id, n] of Object.entries(local.notes || {})) { const x = normNote(id, n); if (x) S.notes[id] = x; } S.profile = { ...S.profile, ...local.profile, settings: { ...DEFAULT_SETTINGS, ...(local.profile && local.profile.settings) } }; adoptProfileLang(); }
  S.loaded = true; render();
  if (!window.claude || !window.claude.use) { initSupabase(); return; }
  setSync("loading");
  let user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch { db = null; }
  if (!db) { setSync("local"); return; }
  const uid = user ? await user.id().catch(() => null) : null;
  S.uid = uid;
  profRef = db.doc("meta/profile");
  notesCol = db.collection("words");
  const timer = setTimeout(() => setSync("warn"), 10000);
  try {
    const p = await profRef.get();
    // One-time move from the first version, which kept words in the viewer's private area.
    if (!p.exists && uid) {
      try {
        const oldProf = db.doc("data/users/" + uid + "/profile");
        const [op, on] = await Promise.all([oldProf.get(), oldProf.collection("notes").limit(1000).get()]);
        on.docs.forEach(d => { if (d.exists) { const n = normNote(d.id, JSON.parse(JSON.stringify(d.data()))); if (n && (!S.notes[n.id] || (S.notes[n.id].updated || 0) < (n.updated || 0))) S.notes[n.id] = n; } });
        if (op.exists) S.profile = mergeProfile(JSON.parse(JSON.stringify(op.data())), S.profile);
      } catch {}
    }
    if (p.exists) S.profile = mergeProfile(JSON.parse(JSON.stringify(p.data())), S.profile);
    adoptProfileLang();
    clearTimeout(timer);
    let first = true;
    unsubNotes = notesCol.limit(1000).onSnapshot(snap => {
      const remote = {};
      snap.docs.forEach(d => { const n = normNote(d.id, JSON.parse(JSON.stringify(d.data()))); if (n) remote[d.id] = n; });
      if (first && !snap.metadata.fromCache) {
        first = false;
        for (const [id, n] of Object.entries(S.notes)) { const r = remote[id]; if (!r || (n.updated || 0) > (r.updated || 0)) { saveNoteRemoteOnly(n); remote[id] = n; } }
        S.notes = remote;
        queueWrite("profile", profRef, JSON.parse(JSON.stringify(S.profile)));
        S.mode = "cloud"; setSync("ok");
      } else if (!first) {
        let added = 0;
        for (const [id, r] of Object.entries(remote)) { const l = S.notes[id]; if (!l) { added++; S.notes[id] = r; } else if ((r.updated || 0) > (l.updated || 0)) S.notes[id] = r; }
        snap.docChanges().forEach(ch => { if (ch.type === "removed" && !remote[ch.doc.id]) delete S.notes[ch.doc.id]; });
        if (added && !session) toast(t("newWordsN", { n: added }));
      } else return;
      lsWrite();
      if (!session) render();
    }, err => { setSync(err && err.code === "revoked" ? "local" : "warn"); });
  } catch (e) {
    clearTimeout(timer);
    if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) { db = null; profRef = notesCol = null; setSync("local"); }

function saveNoteRemoteOnly(n) { if (notesCol) queueWrite("n:" + n.id, notesCol.doc(n.id), JSON.parse(JSON.stringify(n))); }
function mergeProfile(a, b) {
  const log = { ...(a.log || {}) };
  for (const [k, v] of Object.entries(b.log || {})) { const o = log[k]; if (!o || (v.reviews || 0) > (o.reviews || 0)) log[k] = v; }
  return { ...a, settings: { ...DEFAULT_SETTINGS, ...(a.settings || {}) }, log, xp: Math.max(a.xp || 0, b.xp || 0), created: Math.min(a.created || Date.now(), b.created || Date.now()) };
}

function authErr(e) {

  if (/not confirmed/i.test(m)) return t("eNotConfirmed");
  if (/already registered|already been registered/i.test(m)) return t("eExists");
  if (/rate limit|too many/i.test(m)) return t("eRate");
  if (/fetch|network/i.test(m)) return t("eNet");
  if (/password/i.test(m) && /6/.test(m)) return t("ePw6");

const logKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  const has = dt => ((log || {})[logKey(dt)] || {}).reviews > 0;

function allCards(deck) {
  const out = [];
  for (const n of Object.values(S.notes)) { if (n.pending || (deck && n.deck !== deck)) continue; for (const [dir, c] of Object.entries(n.cards)) out.push({ n, dir, c }); }

    if (c.state === 0) nw++;
    else if (c.state === 1 || c.state === 3) { if (c.due <= now + 20 * MIN) lr++; }
    else if (dayIndex(c.due) <= today) rv++;
  }
  const lg = S.profile.log[dayKey(now)] || { newSeen: 0, revDone: 0 };
  const newLeft = Math.max(0, settings().newPerDay - (lg.newSeen || 0));
  const revLeft = Math.max(0, settings().maxReviews - (lg.revDone || 0));

}

      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = 0.92;

      const pick = v.find(v => /natural|enhanced|premium|google|samantha|daniel|serena/i.test(v.name)) || v[0];
      if (pick) u.voice = pick;
      speechSynthesis.speak(u);

function nextDueText() {

  const d = dayIndex(min) - dayIndex(Date.now());
  return d <= 0 ? t("nextToday") : d === 1 ? t("nextTomorrow") : t("nextIn", { n: d, u: pl(d, "day") });
}

/* ---------- Stats ---------- */
function renderStats() {
  const now = Date.now(), today = dayIndex(now);
  const cells = []; const start = new Date(now - 4 * 3600e3); start.setDate(start.getDate() - (7 * 14 + ((start.getDay() + 6) % 7)));
  const d = new Date(start);
  for (let i = 0; i < 105; i++) {
    const k = logKey(d);
    const r = (S.profile.log[k] || {}).reviews || 0;
    const lv = r === 0 ? "" : r < 10 ? "l1" : r < 25 ? "l2" : r < 50 ? "l3" : "l4";
    const isToday = k === dayKey(now);
    const future = d.getTime() > now;
    cells.push(future ? `<i style="visibility:hidden"></i>` : `<i class="${lv} ${isToday ? "today" : ""}" title="${k}: ${r}"></i>`);
    d.setDate(d.getDate() + 1);
  }
  const fc = Array(7).fill(0);
  for (const { c } of allCards()) { if (c.state === 0) continue; const di = Math.max(0, dayIndex(c.due) - today); if (di < 7) fc[di]++; }
  const fmax = Math.max(1, ...fc);
  const wd = WD[LANG];
  const m = { new: 0, learn: 0, young: 0, mature: 0 }; for (const { c } of allCards()) m[maturity(c)]++;
  let rd = 0, ro = 0, total = 0, mins = 0;
  for (const [k, v] of Object.entries(S.profile.log)) { total += v.reviews || 0; mins += (v.ms || 0) / 60000; const age = today - dayIndex(new Date(k + "T12:00").getTime()); if (age < 30) { rd += v.revGraded || 0; ro += v.revOk || 0; } }
  const retTxt = rd >= 10 ? Math.round(ro / rd * 100) + "%" : "—";
  return `<div class="stack">
    <h1 class="title">${t("tStats")}</h1>
    <div class="big-stats">
      <div><b>${streak()}</b><span>${t("sStreak")}</span></div>
      <div><b>${total}</b><span>${t("reviews")}</span></div>
      <div><b>${m.mature}</b><span>${t("wordsLearned")}</span></div>
      <div><b>${retTxt}</b><span>${t("recall")}</span></div>
    </div>
    <h2 class="section-title">${t("studyDays")}</h2>
    <div class="panel"><div class="heat">${cells.join("")}</div><div class="muted" style="font-size:13px;margin-top:8px">${t("minsAll", { n: Math.round(mins) })}</div></div>
    <h2 class="section-title">${t("forecast")}</h2>
    <div class="panel"><div class="bars">${fc.map((v, i) => { const dt = new Date(now + i * DAY); return `<div class="b ${i === 0 ? "t" : ""}"><em>${v}</em><i style="height:${Math.round(v / fmax * 70)}%"></i><span>${i === 0 ? t("todayShort") : wd[dt.getDay()]}</span></div>`; }).join("")}</div></div>
    <h2 class="section-title">${t("cardsT")}</h2>
    <div class="panel">${splitBar(m.new, m.learn, m.young, m.mature)}
    <p class="muted" style="font-size:13px;margin:10px 0 0">${t("matNote")}</p></div>
  </div>`;
}

/* ============================== Study session ============================== */
function buildQueue(deck, extraNew = 0) {
  const now = Date.now(), today = dayIndex(now);
  const lg = todayLog();
  const all = allCards(deck);
  const rev = all.filter(x => x.c.state === 2 && dayIndex(x.c.due) <= today).sort((a, b) => a.c.due - b.c.due).slice(0, Math.max(0, settings().maxReviews - lg.revDone));
  const newLimit = Math.max(0, settings().newPerDay - lg.newSeen) + extraNew;
  // New cards: forward card of a note first; reverse card only after the forward one was seen.
  const newF = all.filter(x => x.c.state === 0 && x.dir === "f").sort((a, b) => a.n.created - b.n.created);
  const newR = all.filter(x => x.c.state === 0 && x.dir === "r" && x.n.cards.f.state !== 0);
  const nw = [...newR, ...newF].slice(0, newLimit);
  const learn = all.filter(x => (x.c.state === 1 || x.c.state === 3)).sort((a, b) => a.c.due - b.c.due);
  // Interleave new among reviews (1 new per 3 reviews)
  const main = []; let i = 0, j = 0;
  while (i < rev.length || j < nw.length) { for (let k = 0; k < 3 && i < rev.length; k++) main.push(rev[i++]); if (j < nw.length) main.push(nw[j++]); }
  return { main: main.map(key), learn: learn.map(key) };
}
const key = x => x.n.id + ":" + x.dir;
function getItem(k) { const [id, dir] = k.split(":"); const n = S.notes[id]; return n && n.cards[dir] ? { n, dir, c: n.cards[dir] } : null; }

function startSession(deck, extraNew = 0) {
  const q = buildQueue(deck, extraNew);
  const total = q.main.length + q.learn.length;
  if (!total) { toast(t("nothingNow")); return; }
  session = { deck, main: q.main, learn: q.learn, done: 0, startCount: total, cur: null, revealed: false, typed: null, ruShown: false, stats: { n: 0, ok: 0, xp: 0, t0: Date.now() }, cardT0: 0, finished: false, combo: 0 };

}
function nextCard() {
  const now = Date.now();
  const learnDue = session.learn.map(getItem).filter(Boolean).filter(x => (x.c.state === 1 || x.c.state === 3) && x.c.due <= now).sort((a, b) => a.c.due - b.c.due);
  let pick = null;
  if (learnDue.length) pick = learnDue[0];
  while (!pick && session.main.length) { const it = getItem(session.main.shift()); if (it) pick = it; }
  if (!pick) {
    const ahead = session.learn.map(getItem).filter(Boolean).filter(x => (x.c.state === 1 || x.c.state === 3) && x.c.due <= now + 20 * MIN).sort((a, b) => a.c.due - b.c.due);
    pick = ahead[0] || null;
  }
  if (!pick) { session.finished = true; session.cur = null; render(); celebrate(); return; }
  session.cur = key(pick);
  session.revealed = false; session.anim = "pop"; session.typed = null; session.ruShown = false; session.cardT0 = Date.now();
  session.typing = pick.dir === "r" && (settings().typingShare >= 1 || (settings().typingShare > 0 && pseudoRand(pick) < settings().typingShare));

}
function pseudoRand(it) { const s = it.n.id + it.c.reps; let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return (h % 1000) / 1000; }

  } else {

  }
  return `<div class="study">${top}<div class="study-body"><div class="kind ${s.typing ? "type" : kind[0]}">${s.typing ? t("kType") : dir === "r" ? t("kRecall") : kind[1]}</div>${body}</div><div class="study-foot"><div class="in">${foot}</div></div></div>`;

// Translations: both Russian and Kazakh; the interface language goes first.
function trBlock(n) {
  const rows = [["RU", n.ru, "ru"], ["ҚАЗ", n.kk, "kk"]].filter(r => r[1]);
  if (!rows.length) return "";
  if (LANG === "kk") rows.sort((a, b) => (b[2] === "kk") - (a[2] === "kk"));
  if (!session.ruShown) return `<button class="ru-btn" data-act="ru">${t("showTr")}</button>`;

const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[^\p{L}\p{N}' ]/gu, " ").replace(/\s+/g, " ").trim();

function rate(g) {

/* ============================== Confetti ============================== */
function celebrate() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"); const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--sun", "--sky", "--good", "--again", "--violet"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 10 - 4, r: Math.random() * 5 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let tk = 0;
  (function f() { ctx.clearRect(0, 0, innerWidth, innerHeight); P.forEach(p => { p.vy += .28; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(0, 0, p.r / 2, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }); if (++tk < 140) requestAnimationFrame(f); else cv.remove(); })();
}

function addStarter() {

function parseImport(text, deck) {
  const tx = text.trim(); if (!tx) return { notes: 0 };
  if (tx.startsWith("{")) {
    try { const j = JSON.parse(tx); if (j.notes) { let c = 0; for (const n of Object.values(j.notes)) { if (n && n.id && n.front && n.cards) { n.updated = Date.now(); saveNote(n); c++; } } if (j.profile) { S.profile = mergeProfile(j.profile, S.profile); saveProfile(); } return { notes: c }; } } catch { return { error: t("jsonErr") }; }
  }
  let c = 0; const bare = [];
  for (const line of tx.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const parts = line.includes("\t") ? line.split("\t") : line.split(/\s*;\s*/);
    const [front, back = "", example = "", ru = "", kk = ""] = parts.map(p => p.trim().replace(/<[^>]+>/g, ""));
    if (!front) continue;
    if (!back) { bare.push(front); continue; }

}

      S.profile.lastDeck = deck; saveProfile(); sheet = null; toast(t("imported", { n: totalN }) + (filled ? t("importedClaude", { n: filled }) : "")); go("words");
    }
    else if (a === "copyExp") { const ta = $("#exp"); try { await navigator.clipboard.writeText(ta.value); toast(t("copied")); } catch { ta.select(); toast(t("textSelected")); } }
    else if (a === "saveFile") {
      const fname = "wordsy-backup-" + dayKey(Date.now()) + ".json";
      if (!window.claude) { try { const u = URL.createObjectURL(new Blob([$("#exp").value], { type: "application/json" })); const l = document.createElement("a"); l.href = u; l.download = fname; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast(t("fileSaved")); } catch { toast(t("fileFail")); } return; }
      try { const dl = await window.claude?.use?.("downloads"); if (!dl) throw 0; await dl.save({ filename: fname, data: $("#exp").value }); toast(t("fileSaved")); }
      catch (err) { toast(err && err.code ? t("fileNotSaved") : t("fileNA")); }
    }
    else if (a === "delAsk") { sheet = { type: "del", id: editId }; render(); }
    else if (a === "delYes") { deleteNote(sheet.id); sheet = null; editId = null; toast(t("deleted")); go("words"); }
  };
  if (S.needLogin) { bindLogin(); return; }
  if (view === "add" && !session) bindAdd();
  if (view === "words") {
    const wq = $("#wq"); wq.oninput = () => { wordQuery = wq.value; const pos = wq.selectionStart; render(); const n = $("#wq"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} };
    $("#wdeck").onchange = e => { wordDeck = e.target.value; render(); };
  }
  if (view === "prefs") bindPrefs();
}
function bindAdd() {
  const f = $("#addForm");
  f.onsubmit = e => {
    e.preventDefault();
    const front = $("#f-front").value.trim(), back = $("#f-back").value.trim();
    if (!front || (!back && window.claude)) { toast(t("fillWordBack")); return; }
    const deck = $("#f-deck").value.trim() || t("myWords");
    const ex = $("#f-ex").value.trim(), ru = $("#f-ru").value.trim(), kk = $("#f-kk").value.trim(), wantRev = $("#f-rev").checked;
    if (editId && S.notes[editId]) {
      const n = S.notes[editId];
      Object.assign(n, { front, back: back || "—", pending: !back, example: ex, ru, kk, deck, updated: Date.now() });
      if (wantRev && !n.cards.r) n.cards.r = newSched();
      if (!wantRev && n.cards.r) delete n.cards.r;
      saveNote(n); editId = null; toast(t("saved")); go("words");
    } else {
      const dupe = Object.values(S.notes).find(n => n.front.toLowerCase() === front.toLowerCase());
      const nn = makeNote({ front, back: back || "—", example: ex, ru, kk, deck, reverse: wantRev }); if (!back) nn.pending = true; saveNote(nn);
      S.profile.lastDeck = deck; saveProfile();
      toast(dupe ? t("addedDupe") : !back ? t("addedPending") : t("addedOk"));
      render(); $("#f-front").focus();
    }
  };
  const ai = $("#aiFill");
  if (sampleCap === undefined && window.claude?.use) window.claude.use("sample").then(s => { sampleCap = s; const b = $("#aiFill"); if (b) b.hidden = !s; }).catch(() => { sampleCap = null; });
  ai.onclick = async () => {
    const word = $("#f-front").value.trim();
    if (!word) { toast(t("writeWordFirst")); $("#f-front").focus(); return; }
    if (!sampleCap) { toast(t("claudeNA")); return; }
    ai.disabled = true; ai.innerHTML = `<span class="spin"></span>${t("thinking")}`;
    try {
      const r = await sampleCap.json(
        `You help an A2-level English learner who speaks Russian and Kazakh make a flashcard.\nWord or phrase: "${word}"\nReply with only a JSON object: {${CLAUDE_FIELDS}}.\nExample: {"front":"steep","back":"going up or down very quickly, so it is hard to walk","example":"The hill was too steep for my bike.","ru":"крутой (о склоне)","kk":"тік (беткей)"}`,
        { modelTier: "quick" });
      if (r && typeof r === "object") {
        if (r.front) $("#f-front").value = String(r.front);
        if (r.back) $("#f-back").value = String(r.back);
        if (r.example) $("#f-ex").value = String(r.example);
        if (r.ru) $("#f-ru").value = String(r.ru);
        if (r.kk) $("#f-kk").value = String(r.kk);
      }
    } catch (err) { toast(err && err.code === "not_granted" ? t("notGranted") : err && err.code === "rate_limited" ? t("rateLimited") : t("tryAgain")); if (err && err.code === "not_granted") { sampleCap = null; } }
    const b = $("#aiFill"); if (b) { b.disabled = false; b.innerHTML = I.spark + t("aiFill"); b.hidden = !sampleCap; }
  };
}
function bindPrefs() {
  const st = settings();
  const num = (id, k, lo, hi) => { $(id).onchange = e => { const v = Math.round(+e.target.value); if (!isNaN(v)) { st[k] = Math.min(hi, Math.max(lo, v)); saveProfile(); } }; };
  num("#s-new", "newPerDay", 0, 100); num("#s-max", "maxReviews", 10, 2000); num("#s-goal", "goal", 5, 500);
  const r = $("#s-ret"); r.oninput = () => { $("#retv").textContent = Math.round(r.value * 100) + "%"; }; r.onchange = () => { st.retention = +(+r.value).toFixed(2); saveProfile(); };
  const seg = (id, k, cast) => $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; st[k] = cast(b.dataset.v); saveProfile(); $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); if (k === "accent") speak("Hello! Nice to meet you."); };
  seg("#s-type", "typingShare", Number); seg("#s-acc", "accent", String);
  $("#s-auto").onchange = e => { st.autoplay = e.target.checked; saveProfile(); };
}

/* ============================== Boot ============================== */
window.claude?.use?.("tts").then(x => { ttsCap = x; }).catch(() => {});
applyLang();
render();
initStore();
})();
</script>
